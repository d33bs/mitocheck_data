[tool.poetry]
name = "mitocheck-data"
version = "3.0.0"
description = "All information regarding the download and processing of Mitocheck data from IDR study with accession idr0013 (screenA)."
authors = ["Way Science Community"]
license = "CC0-1.0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">3.11,<3.13"
poethepoet = "^0.25.0"
duckdb = "^0.10.1"
pyarrow = ">=12"
lancedb = ">=0.6.7"
pandas = "^2.2.1"
docker = "^7.0.0"
h5py = "^3.11.0"
pybasic = { git = "https://github.com/WayScience/BaSiCPy.git", branch="mitocheck_data" }
scikit-image = ">=0.23.2"
serpula_rasa = { git = "https://github.com/WayScience/serpula_rasa.git", branch="main" }
imageio = "^2.37.0"
jupyterlab = "^4.4.10"
jupytext = "^1.18.1"

[tool.poe.tasks.package_data]
# run a task to package data
env = { DOCKER_DEFAULT_PLATFORM = "linux/amd64" }
shell = """
  python 5.data_packaging/infer_schema.py &&
  python 5.data_packaging/gather_images.py &&
  python 5.data_packaging/create_lancedb.py
"""

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.setuptools_scm]

[tool.jupytext]
formats = "ipynb,py:light"